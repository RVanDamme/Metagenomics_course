project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - setup.qmd
    - galaxy.qmd
    - project.qmd
    - slides.qmd
    - tutorials/*.qmd
    - ATTRIBUTION.md
    - data/README.md
  resources:
    - slides/*.pdf

website:
  title: "Introduction to Metagenomics"
  site-url: https://rvandamme.github.io/Metagenomics_course/
  repo-url: https://github.com/RVanDamme/Metagenomics_course
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Setup
        href: setup.qmd
      - text: Tutorials
        menu:
          - text: "Day 1: read-based taxonomy"
            href: tutorials/d1-read-taxonomy.qmd
          - text: "Day 2: assembly and binning"
            href: tutorials/d2-assembly-binning.qmd
          - text: "Day 2: amplicon sequencing (DADA2)"
            href: tutorials/d2-amplicon-dada2.qmd
      - text: Galaxy route
        href: galaxy.qmd
      - text: Data
        href: data/README.md
      - text: Slides
        href: slides.qmd
      - text: Project
        href: project.qmd
    tools:
      - icon: github
        href: https://github.com/RVanDamme/Metagenomics_course
  page-footer:
    center: "Text and slides: CC BY 4.0. Code: MIT. [Licence and credits](/ATTRIBUTION.md)"

format:
  html:
    # light theme by default; the reader can switch to the dark theme with the button in the menu bar
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

# Tutorial code is shown, never run, when the site is built: no bioinformatics tool or R is needed to publish.
filters:
  - _filters/rchunks.lua
