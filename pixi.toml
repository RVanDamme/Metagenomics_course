# Local environment for the course "Introduction to Metagenomics" (mag-2026).
# Install everything:   pixi install --all
# Start working:        pixi shell            (main tools)
#                       pixi shell -e checkm1 (or checkm2, prokka; on macOS also bracken-mac)
# Check your setup:     pixi run check
#
# pixi.lock records the exact packages for every platform. Do not edit it by hand:
# after changing this file, run "pixi lock" and commit both files.

[workspace]
name = "mag-2026"
description = "Tools for the local tutorials of the Introduction to Metagenomics course"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# ---- main environment: quality control, read taxonomy, assembly, binning, MAG taxonomy ----
[dependencies]
fastqc = "0.13.0.*"
fastp = "1.4.0.*"
multiqc = "==1.35"
seqkit = "2.14.0.*"
kraken2 = "2.17.2.*"
krakentools = "1.2.1.*"
krona = "2.8.1.*"
sickle-trim = "==1.33"
megahit = "1.2.9.*"
bowtie2 = "2.5.5.*"
samtools = ">=1.20"  # the exact version follows the htslib that MetaBAT 2 was built with (see pixi.lock)
metabat2 = "==2.18"
sourmash = "4.9.4.*"

# Bracken 3.1 exists on bioconda for Linux only. macOS uses the "bracken-mac" environment below.
[target.linux-64.dependencies]
bracken = "==3.1"

[tasks]
check = { cmd = "bash scripts/check_setup.sh", description = "Check that the tools, memory and disk are ready for the course" }

# ---- bin quality with CheckM 1 (separate environment: its dependencies conflict with the main one) ----
[feature.checkm1.dependencies]
checkm-genome = "1.3.0.*"

# ---- bin quality with CheckM2 ----
[feature.checkm2.dependencies]
checkm2 = "1.1.0.*"

# ---- genome annotation with Prokka: no Apple Silicon build, so macOS uses the Intel build (Rosetta) ----
# To revisit when macOS no longer includes Rosetta 2 (see the Setup page).
[feature.prokka]
platforms = ["linux-64", "osx-64"]

[feature.prokka.dependencies]
prokka = "1.15.6.*"

# ---- Bracken on macOS: the newest macOS build is 2.6.1 (Intel; runs under Rosetta on Apple Silicon) ----
[feature.bracken-mac]
platforms = ["osx-64"]

[feature.bracken-mac.dependencies]
bracken = "2.6.1.*"

# ---- for the teacher: preview the course site (quarto preview) ----
[feature.site.dependencies]
quarto = "1.11.9.*"

[environments]
checkm1 = { features = ["checkm1"], no-default-feature = true }
checkm2 = { features = ["checkm2"], no-default-feature = true }
prokka = { features = ["prokka"], no-default-feature = true }
bracken-mac = { features = ["bracken-mac"], no-default-feature = true }
site = { features = ["site"], no-default-feature = true }
